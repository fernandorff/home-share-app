# CI gate: typecheck + lint + migrations-match-schema check + full vitest suite on every push/PR to main and dev,
# plus a Playwright smoke E2E (job `e2e`) against a built app and a throwaway Postgres.
# Tests are fully self-contained — vitest's globalSetup boots an in-process Postgres (pglite over a TCP
# socket) and applies the schema via `prisma migrate diff`, so they need no database service and no secrets.
# The only service is an empty, throwaway Postgres used as Prisma's shadow database by the migrations check.
name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Shadow database for `prisma migrate diff --from-migrations` (it replays prisma/migrations here, then
      # wipes it). Empty and disposable — never a real database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 22: Node 22 ships npm 10, whose `npm ci` rejects this lockfile over an
          # optional peer dep (@swc/core → @swc/helpers >=0.5.17); npm 11 resolves it fine.
          node-version: 24
          cache: npm

      - run: npm ci

      # prisma.config.ts reads DATABASE_URL at load time; generate never connects, but the
      # variable must exist. The value is a placeholder — tests pin their own URL (pglite).
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      # The migrations folder must still reproduce schema.prisma: replays prisma/migrations on the shadow
      # database and diffs it against the schema. Exit 2 = schema.prisma changed without a migration → run
      # `npx prisma migrate dev --name <change>` locally (against the local Docker database) and commit it.
      # DATABASE_URL stays the placeholder; only the shadow database is touched.
      - run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run test

      # `npx next build` directly — `prisma generate` already ran above (`npm run build` is just the
      # two together and never touches a database). The build needs no DB (all pages are dynamic);
      # verified locally with this same placeholder URL.
      - run: npx next build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

  # Smoke E2E: seeds one house through the real API, then drives login, expenses (incl. creating one),
  # balances and shopping in Chromium. Same test will later run against the Rust server (spec 013).
  e2e:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.58 has no Chromium build yet.
    runs-on: ubuntu-24.04
    services:
      # Throwaway app database, migrated from scratch on every run. Never a real database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeshare_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homeshare_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeshare_e2e
      # `next start` runs with NODE_ENV=production, where a JWT secret is required. CI-only value.
      JWT_SECRET: e2e-ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
